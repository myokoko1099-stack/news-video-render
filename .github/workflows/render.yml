name: render

on:
  workflow_dispatch:
    inputs:
      props_json:
        description: 'Video props as JSON (leave empty to use src/sample.json)'
        required: false
        default: ''

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install system libraries for headless Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libgbm1 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libpango-1.0-0 libcairo2 || true
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2 || true

      - name: Install dependencies
        run: npm install

      - name: Prepare props
        env:
          PROPS_JSON: ${{ inputs.props_json }}
        run: |
          if [ -n "$PROPS_JSON" ]; then
            printf '%s' "$PROPS_JSON" > props.json
          else
            cp src/sample.json props.json
          fi

      - name: Render video
        run: npx remotion render src/index.ts News out/video.mp4 --props=props.json

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: out/video.mp4

      - name: Send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets not set - skipping send. Download the artifact instead."
            exit 0
          fi
          curl -sS -F chat_id="$TELEGRAM_CHAT_ID" -F video=@out/video.mp4 -F width=1080 -F height=1920 -F supports_streaming=true "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo"
